gcs_link_node:
  ros__parameters:
    # Dia chi may GCS tren LAN. Chi la dia chi DU PHONG: Pi uu tien dia chi hoc duoc tu goi
    # hop le gan nhat (muc 2.1), va quen dia chi do khi mat lien ket de khong bi mot dia chi
    # cu chiem duong len vinh vien.
    gcs_host: "192.168.10.120"
    gcs_port: 14550
    local_port: 14551
    link_timeout_s: 5.0
    heartbeat_interval_s: 1.0
    # Chu ky goi MAVLink 2 (giao uoc GCS muc 7.6).
    #
    # >>> DANG TAT THEO YEU CAU NGUOI VAN HANH (2026-09-16), de chay tren WiFi LAN kin <<<
    #
    # Tat nghia la: BAT CU AI vao duoc mang WiFi nay deu gui duoc lenh cho drone, ke ca DISARM
    # giua luc dang bay. Trong LAN gia dinh thi chap nhan duoc; ra khoi do thi khong.
    #
    # PHAI DAT LAI true truoc khi: bay ngoai mang kin, dung 4G/LTE, hoac dung WiFi cong cong.
    # Thieu khoa ma true thi node TU CHOI KHOI DONG - co y, de khong ai vo tinh bay voi kenh mo.
    # Tao khoa: python3 tools/tao_khoa_gcs.py   roi chep sang GCS bang duong an toan.
    #
    # Hai ben phai BAT/TAT CUNG LUC. Lech nhau thi ben bat se bo sach goi cua ben kia va trieu
    # chung GIONG HET MAT SONG: khong loi, khong log, chi im lang (giao uoc 7.6).
    signing_required: false
    signing_key_file: "~/.drone_gcs_key"

telemetry_aggregator_node:
  ros__parameters:
    publish_rate_hz: 2.0         # tan so thap co dinh; tren WiFi thi nhe, nhung giu de con
                                 # du dia cho lenh khan khi duong truyen xau
