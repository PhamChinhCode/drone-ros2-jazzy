# BAN DO BAI DAP (tag) DUNG CHUNG - nguon duy nhat cho marker_pose_republisher_node,
# landing_target_bridge_node va mission_manager_node (nap kem file yaml rieng cua tung node).
# Khong co GPS: vi tri waypoint cua nhiem vu SUY TU BANG NAY theo expected_marker_id.
# PHAI khop tag.ids / tag.frames trong apriltag.yaml.
/**:
  ros__parameters:
    # [id, x, y, z, ...] - toa do tag trong khung odom (ENU, m). Khi EKF da thay tag, odom neo
    # theo bang nay; huong truc x theo yaw cua FC (tu ke chua kiem 10.6a - yaw tuong doi).
    known_tags: [0.0, 0.000, 0.000, 0.000,
                 1.0, 10.000, 0.000, 0.000,
                 2.0, -0.002, 0.000, 0.055]
    # Ten khung TF tung tag, cung thu tu known_tags - PHAI khop tag.frames cua apriltag.yaml
    # (09-17 apriltag.yaml doi sang home/a/b nhung file nay con pad_home/... -> marker_pose khong
    # bao gio tra duoc TF, EKF khong neo theo tag; sua 10-08, test_pad_map kiem hai file khop).
    tag_frames: [home, a, b]
    # Huong "tren" cua tag [id, do, ...]: do tu truc N ban do, CHIEU KIM DONG HO (giao uoc GCS 8.6,
    # ban 0.8). Chi khai tag DA BIET huong; tag co huong moi co tag nho. Vi du: [0.0, 90.0, 1.0, 0.0]
    known_tags_heading: []
    # Dai ID (user 10-27, apriltag.yaml): < 20 = tag NEO vi tri, >= 20 = tag hop hang.
    # Tag nho cua bai: id = id_to + 10, canh 10 cm, IN CUNG TO voi tag to (cung mat phang), tam cach
    # tam tag to forward_m ve phia "tren". Xuong thap tag to ra khoi khung thi bridge bam tag nho, suy
    # tam bai theo truc TREN do duoc cua chinh tag nho (khong can huong khai bao). 0,21 m = to in A3
    # (10-28, tools/in_bai_a3.py + GCS padSheet.ts): tag to 25 cm + vien 1 o (31,25 mm) thi tam-tam toi
    # thieu 0,206 m. DO LAI sau khi in.
    pad_small_tag_id_offset: 10
    pad_small_tag_size_m: 0.10
    pad_small_tag_forward_m: 0.21
    # Tag hop hang (user 10-27): id box_tag_id_min .. +box_tag_count-1, canh 10 cm, dan tren nap hop
    # 12x12x12 cm. Hop nao cung gap duoc, dat tu do phia "duoi" tag to, xoay bat ky (drone quay mui
    # <= 45 do ve mat hop gan nhat). box_forward_m: diem BAT DAU tim hop so voi tam tag to theo huong
    # bai (am = phia "duoi"); thay hop roi thi bam vi tri do. Tag hop KHONG neo EKF.
    box_tag_id_min: 20
    box_tag_count: 10
    box_forward_m: -0.30
    box_height_m: 0.12
    # Goc WGS84 cua ban do (diem x = y = z = 0) va phuong vi truc N ban do do tu Bac THAT (chieu
    # kim dong ho). GCS gui kem ban do tag (giao uoc GCS 8.7); do tai cho bang `gps_survey`.
    # false = CHUA CO GOC: GPS khong vao EKF, GCS khong nhan lat/lon (GLOBAL_POS_VALID = 0).
    geo_origin_valid: false
    geo_origin_lat: 0.0
    geo_origin_lon: 0.0
    geo_origin_alt: 0.0
    geo_north_yaw_deg: 0.0

