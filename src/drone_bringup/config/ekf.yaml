# robot_localization/ekf_node. Nguyen tac: marker cho vi tri TUYET DOI (thua, tin nhieu),
# optical flow cho van toc TUONG DOI (lien tuc, troi tich luy).
ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    two_d_mode: false
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom
    map_frame: map

    imu0: /mavros/imu/data
    imu0_config: [false, false, false,   # x, y, z
                  true,  true,  true,    # roll, pitch, yaw
                  false, false, false,   # vx, vy, vz
                  true,  true,  true,    # vroll, vpitch, vyaw
                  true,  true,  true]    # ax, ay, az
    imu0_differential: false
    imu0_queue_size: 10

    twist0: /optical_flow/velocity
    twist0_config: [false, false, false,
                    false, false, false,
                    true,  true,  false,  # CHI tin vx, vy ngang - KHONG dung vz tu optical flow
                    false, false, false,
                    false, false, false]
    twist0_queue_size: 5

    pose0: /marker/pose_odom
    pose0_config: [true, true, true,     # marker cho vi tri tuyet doi x, y, z khi co
                   false, false, false,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    pose0_differential: false
    pose0_rejection_threshold: 2.0       # loai pose marker nhay vot bat thuong (Mahalanobis)
    pose0_queue_size: 5
