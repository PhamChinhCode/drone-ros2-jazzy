# robot_localization/ekf_node. Nguyen tac: marker cho vi tri TUYET DOI (thua, tin nhieu),
# optical flow cho van toc TUONG DOI (lien tuc, troi tich luy).
ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    two_d_mode: false
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom
    map_frame: map
    # Pose marker va optical flow toi tre 250-430 ms so voi luc chup (Pi 4 day tai, do 09-14) trong
    # khi IMU luon moi. Mac dinh (false) EKF BO moi do cu hon lan cap nhat gan nhat -> chi con tich
    # phan IMU, troi 10 m roi pose0_rejection_threshold loai luon marker dung. true + 1 s lich su:
    # hoi tu ve marker trong 5 s, dao dong < 2,5 cm.
    smooth_lagged_data: true
    history_length: 1.0

    imu0: /mavros/imu/data
    imu0_config: [false, false, false,   # x, y, z
                  true,  true,  true,    # roll, pitch, yaw
                  false, false, false,   # vx, vy, vz
                  true,  true,  true,    # vroll, vpitch, vyaw
                  true,  true,  true]    # ax, ay, az
    imu0_differential: false
    # /mavros/imu/data co ca trong luc (FC gui gia toc tho) - khong tru thi z bi keo len 9,8 m/s^2.
    imu0_remove_gravitational_acceleration: true
    imu0_queue_size: 10

    twist0: /optical_flow/velocity
    twist0_config: [false, false, false,
                    false, false, false,
                    true,  true,  false,  # CHI tin vx, vy ngang - KHONG dung vz tu optical flow
                    false, false, false,
                    false, false, false]
    twist0_queue_size: 5

    # Van toc FC (ODOMETRY, flow MTF01P) qua fc_velocity_node - chi co mau khi hop le
    # (covariance 1e6 bi bo truoc, GIAO_UOC 4.2a, 11.3 P3). Hai nguon ngang doc lap (camera Pi +
    # cam bien flow FC) cung vao vx, vy; vz CHI tu FC (camera khong do duoc vz).
    twist1: /fc/velocity_xy
    twist1_config: [false, false, false,
                    false, false, false,
                    true,  true,  false,
                    false, false, false,
                    false, false, false]
    twist1_queue_size: 5

    twist2: /fc/velocity_z
    twist2_config: [false, false, false,
                    false, false, false,
                    false, false, true,
                    false, false, false,
                    false, false, false]
    twist2_queue_size: 5

    pose0: /marker/pose_odom
    pose0_config: [true, true, true,     # marker cho vi tri tuyet doi x, y, z khi co
                   false, false, false,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    pose0_differential: false
    pose0_rejection_threshold: 2.0       # loai pose marker nhay vot bat thuong (Mahalanobis)
    pose0_queue_size: 5
