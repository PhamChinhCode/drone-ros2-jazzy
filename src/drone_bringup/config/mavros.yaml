# Dung plugin_allowlist thay vi de mac dinh bat toan bo: vua giam tai CPU Pi 4, vua tranh
# plugin ngam gui lenh ma firmware tuy bien khong hieu.
/**:
  ros__parameters:
    fcu_url: "/dev/ttyAMA0:921600"      # khop baudrate MAVLink da cau hinh tren H743
    gcs_url: ""                          # de trong: GCS di duong rieng qua gcs_link_node
    target_system_id: 1
    target_component_id: 1
    # Covariance IMU - KHONG de MAVROS dung mac dinh hardcode. Mac dinh cua no la
    # orientation_stdev=1.0 rad (57 do) va linear_acceleration_stdev=0.0003 m/s^2,
    # khien EKF bo qua goc nghieng cua FC va tin tuyet doi vao gia toc tho - nguoc hoan toan.
    # orientation: phia FC chot 1 do cho roll/pitch (2026-09-12). KHONG dung so tu
    # ekf_attitude_uncertainty_deg() hay nhieu ngan han do duoc - do la bo loc tu cham diem
    # chinh no, khong mo hinh hoa lech lap dat / troi bias / rung dong co.
    # accel + gyro: do that 896 mau/20s luc drone dung im tren ban.
    # CANH BAO: hai so nay la SAN khi dung im. Co rung dong co phai do lai (muc C).
    orientation_stdev: 0.01745          # 1 do
    linear_acceleration_stdev: 0.0185   # m/s^2, do tren ban
    angular_velocity_stdev: 0.00183     # rad/s, do tren ban
    plugin_allowlist:
      # 09-14 bo 'setpoint_position', 'vfr_hud', 'local_position': khong node Pi nao dung (VFR_HUD chi
      # hien thi; LOCAL_POSITION_NED trung ODOMETRY). Do: MAVROS 72 % -> 52 % CPU (GIAO_UOC 11.1 #14).
      - 'sys_status'
      - 'setpoint_raw'
      - 'command'
      - 'imu'
      - 'global_position'   # /global_position/global cho telemetry_aggregator (GPS, hien NO_FIX)
      - 'debug_value'   # NAMED_VALUE_INT OB_STATE/OB_AUTH/OB_EXIT tu FC (tra_loi_dot_2_pi4.md muc 2.1)
      - 'distance_sensor'  # DISTANCE_SENSOR laser MTF01P - GIAO_UOC_FC_ROS2.md muc 8.3, 11.2
      - 'odometry'      # ODOMETRY 331 tu FC hop dong 1.2 -> /mavros/odometry/in (GIAO_UOC muc 11.2)
      - 'rc_io'         # RC_CHANNELS 65 tu FC hop dong 1.2 -> /mavros/rc/in, CHI hien thi (GIAO_UOC muc 6.3)
    # KHONG bat 'landing_target': LANDING_TARGET (149) phe bo tu hop dong 1.4 - FC khong xu ly,
    # Pi tu dong vong van toc theo marker (GIAO_UOC 11.1 #12, #13c).

# Laser MTF01P: FC phat id=0, PITCH_270, 20 Hz (GIAO_UOC muc 11.2). Plugin chi phat topic cho id da
# khai o day. send_tf=false: chua do vi tri lap laser tren khung - khong bia TF.
# min_distance = 15 cm tu FC (chot 09-13, laser doc ~17 cm khi nam dat - GIAO_UOC 11.2).
/**/distance_sensor:
  ros__parameters:
    config: |
      mtf01p:
        id: 0
        frame_id: "mtf01p_laser"
        orientation: PITCH_270
        field_of_view: 0.0
        send_tf: false
