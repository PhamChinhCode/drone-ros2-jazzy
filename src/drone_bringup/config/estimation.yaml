marker_pose_republisher_node:
  ros__parameters:
    pos_covariance: 0.01         # m^2, thap vi marker la vi tri tuyet doi
    target_frame: odom
    # known_tags, tag_frames: config/tags.yaml (dung chung voi mission_manager, landing_target_bridge)

ekf_health_node:
  ros__parameters:
    max_pos_variance: 2.0
    unhealthy_after_s: 2.0
    odom_timeout_s: 1.0
    publish_rate_hz: 5.0
    # Ep EKF ve marker (/set_pose): EKF lech xa thi pose0_rejection_threshold loai ca marker dung
    # (do 09-15: lech 20 m mat 23 s moi tu ve). Lech > reset_max_error_m lien tuc reset_after_s,
    # hoac khong healthy, ma co pose marker moi -> ep.
    # 1.0 -> 0.5 (2026-09-22, co GPS): GPS keo EKF lech tag 0,6-1,0 m thi marker bi
    # pose0_rejection_threshold (2 sigma ~ 0,57 m) LOAI ma chua du 1 m de ep -> EKF ket lech
    # gan 1 m canh bai dap (do that ngoai troi). Tag nhieu ~2-3 cm nen 0,5 m qua 1 s la lech that.
    reset_max_error_m: 0.5
    reset_after_s: 1.0
    reset_marker_max_age_s: 1.0
    reset_cooldown_s: 2.0
