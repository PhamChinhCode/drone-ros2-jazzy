mission_manager_node:
  ros__parameters:
    search_timeout_s: 20.0
    max_retries: 3
    acceptance_radius_m: 1.5
    pre_dropoff_settle_s: 2.0    # giu on dinh truoc khi mo gripper, tranh tha khi con dao dong
    takeoff_alt_m: 5.0            # tran cung - ToF toi da 8 m, 5 m con bien an toan
    anchor_margin_m: 0.5          # leo them sau khi neo (EkfHealth.anchored) truoc khi roi TAKEOFF
    anchor_wait_s: 10.0           # cham tran ma chua neo thi lo lung cho ngan nay giay roi EMERGENCY_LAND
    state_publish_rate_hz: 5.0
    # Pi dieu khien huong mui + tiep can thang hang bai co huong (PAD_ALIGN). BAT 2026-10-09: yaw FC
    # dat WP0 (log 074903) + kiem dau tren ban: muc tieu lech trai 30 do -> Pi +0,523 rad/s FLU ->
    # FC OB_T_YAWR -29,96 do/s (FC + = phai) - dung dau, dung do lon.
    yaw_control: true

gripper_controller_node:
  ros__parameters:
    simulate: true               # false = gui lenh kep xuong FC (servo cam PD14 tren FC)
    # Xung dong/mo nam o tham so FC (servo_grip_open_us / servo_grip_close_us), khong o day.
    travel_s: 0.5                # cho servo kep han sau khi FC nhan lenh
    status_rate_hz: 10.0

fc_command_bridge_node:
  ros__parameters:
    ack_timeout_s: 6.0            # > command_ack_timeout 5 s cua MAVROS: de MAVROS bao timeout truoc
    setpoint_rate_hz: 20.0
