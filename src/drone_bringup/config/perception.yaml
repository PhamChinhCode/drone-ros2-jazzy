optical_flow_node:
  ros__parameters:
    max_corners: 100
    # Nguong TUONG DOI so voi goc manh nhat anh. 0,3 (cu): do 10-09 tren Pi chi 9 diem/khung (canh
    # tuong phan manh trong khung lam moi goc khac bi loai) -> sau loc hinh hoc < 8 -> 0 Hz. 0,02 du
    # 100 diem; diem bam sai van bi max_lk_error loai.
    quality_level: 0.02
    min_distance: 7
    min_tracked_features: 8      # duoi nguong nay thi KHONG publish gi ca
    max_lk_error: 20.0           # loai diem bam sai: bam tot err~0, anh trang/nhieu err 70-150
    refresh_interval_s: 1.5
    process_every_n_frames: 2    # bo bot khung neu CPU khong kip
    base_covariance: 0.05
    # Hinh hoc camera nghieng (flow_geometry, 2026-10-08):
    max_ray_angle_deg: 65.0      # bo tia lech phuong thang dung qua goc nay (giao mat dat qua xa)
    max_imu_gap_s: 0.05          # IMU gan stamp anh nhat phai trong khoang nay
    altitude_filter_tau_s: 0.2   # loc laser luong tu 1 cm (nhay 1 cm = 0,05 m/s vx gia)

marker_quality_node:
  ros__parameters:
    publish_rate_hz: 10.0
    visible_timeout_s: 0.5
    expected_marker_id: -1       # -1 = chap nhan moi ID; mission_manager se ghi de khi bay

# Tu phoi sang (sensor khong co AE). Muc 60: do 09-14 trong nha va 09-19 ngoai troi, mean 60-67
# cho apriltag bat tag moi khung. exposure tinh theo dong: 30 FPS ~7,65 us/dong -> 500 = 3,8 ms,
# bay 1 m/s o 0,7 m nhoe ~1,6 px. gain 16 = 1x; tran 128 (8x) vi gain cao them nhieu cho flow.
auto_exposure_node:
  ros__parameters:
    target_mean: 60.0
    deadband: 0.15
    max_saturated: 0.02          # 80/16 ngoai troi chay 23 % -> tag mat; 40/16 chay 0-0,2 %
    exposure_min: 4
    exposure_max: 500
    gain_min: 16
    gain_max: 128
    rate_hz: 5.0
