# Gui: ros2 run drone_mission send_mission_plan $(ros2 pkg prefix drone_sim)/share/drone_sim/config/missions/sim_ba_bai.yaml
mission_id: 903
plan_name: sim_ba_bai
max_retries: 2
search_timeout_s: 10.0
waypoints:
